<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 72" role="img" aria-labelledby="title">
  <title id="title">Send an email</title>
  <defs>
    <linearGradient id="sweep" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset=".5" stop-color="#fff" stop-opacity=".13" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <style>
      .sweep { animation: travel 4s ease-in-out infinite; }
      .dot { animation: pulse 2s ease-in-out infinite; transform-origin: 218px 19px; }
      .arrow { animation: nudge 1.8s ease-in-out infinite; }
      @keyframes travel { 0%, 15% { transform: translateX(-260px); } 75%, 100% { transform: translateX(260px); } }
      @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
      @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
    </style>
    <clipPath id="clip"><rect width="240" height="72" rx="12" /></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="240" height="72" fill="#142321" />
    <path d="M0 0h5v72H0z" fill="#FF947D" />
    <circle cx="218" cy="19" r="3" fill="#FF947D" class="dot" />
    <path class="sweep" d="M0 0h90L190 72h-90z" fill="url(#sweep)" />
    <rect x="17" y="18" width="36" height="36" rx="9" fill="#874A3C" />
    <path d="M24 29h22a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H24a2 2 0 0 1-2-2V31a2 2 0 0 1 2-2m11 9 11-7H24z" fill="#fff" />
    <text x="65" y="33" fill="#F5F0E3" font-family="Arial,sans-serif" font-size="14" font-weight="700">EMAIL</text>
    <text x="65" y="49" fill="#A9BDB3" font-family="monospace" font-size="9">SAY HELLO</text>
    <path class="arrow" d="M216 37h-10m6-4 4 4-4 4" fill="none" stroke="#FF947D" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" />
    <path d="M0 70h240" stroke="#FF947D" stroke-opacity=".42" />
  </g>
</svg>