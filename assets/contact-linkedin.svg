<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 72" role="img" aria-labelledby="title">
  <title id="title">Connect on LinkedIn</title>
  <defs>
    <linearGradient id="sweep" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset=".5" stop-color="#fff" stop-opacity=".13" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <style>
      .sweep { animation: travel 4s ease-in-out infinite; }
      .dot { animation: pulse 2s ease-in-out infinite; transform-origin: 218px 19px; }
      .arrow { animation: nudge 1.8s ease-in-out infinite; }
      @keyframes travel { 0%, 15% { transform: translateX(-260px); } 75%, 100% { transform: translateX(260px); } }
      @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
      @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
    </style>
    <clipPath id="clip"><rect width="240" height="72" rx="12" /></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="240" height="72" fill="#161B22" />
    <path d="M0 0h5v72H0z" fill="#0A66C2" />
    <circle cx="218" cy="19" r="3" fill="#0A66C2" class="dot" />
    <path class="sweep" d="M0 0h90L190 72h-90z" fill="url(#sweep)" />
    <rect x="17" y="18" width="36" height="36" rx="9" fill="#184F9C" />
    <path d="M27 33h5v14h-5zm2.5-7a2.7 2.7 0 1 1 0 5.4 2.7 2.7 0 0 1 0-5.4M36 33h4.8v1.9c.8-1.4 2.1-2.3 4.1-2.3 4 0 5.1 2.6 5.1 6V47h-5v-6.6c0-1.6 0-3.6-2.2-3.6s-2.5 1.7-2.5 3.5V47h-5z" fill="#fff" />
    <text x="65" y="33" fill="#F5F7FA" font-family="Arial,sans-serif" font-size="14" font-weight="700">LINKEDIN</text>
    <text x="65" y="49" fill="#A7B2C0" font-family="monospace" font-size="9">LET'S CONNECT</text>
    <path class="arrow" d="M216 37h-10m6-4 4 4-4 4" fill="none" stroke="#0A66C2" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" />
    <path d="M0 70h240" stroke="#0A66C2" stroke-opacity=".42" />
  </g>
</svg>