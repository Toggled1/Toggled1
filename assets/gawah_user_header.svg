<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 320" width="100%" height="100%">
  <defs>
    <!-- Modern Engineering Typography -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;display=swap');

      .title-name {
        fill: #F5F5F5;
        stroke: #0D1117;
        stroke-width: 3px;
        stroke-linejoin: bevel;
        filter: url(#pixel-shadow);
        transform-box: fill-box;
        transform-origin: center;
        animation: title-arrive 1.1s cubic-bezier(.2,.75,.25,1) both;
      }

      .subtitle-text {
        font-family: 'IBM Plex Mono', 'Fira Code', monospace;
        font-weight: 500;
        font-size: 25px;
        fill: #D6D6D6;
        letter-spacing: 4px;
        text-anchor: middle;
        animation: subtitle-arrive .8s ease-out .35s both;
      }

      @keyframes title-arrive {
        from { opacity: 0; transform: scaleX(1.08); }
        to { opacity: 1; transform: scaleX(1); }
      }

      @keyframes subtitle-arrive {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .wave-path {
        fill: none;
        stroke-linecap: round;
        will-change: transform;
      }

      /* Seamless Wave Animation Loops */
      @keyframes float-left-bg {
        0%   { transform: translate3d(0px, 0, 0); }
        100% { transform: translate3d(-792px, 0, 0); }
      }

      @keyframes float-right-mid {
        0%   { transform: translate3d(-528px, 0, 0); }
        100% { transform: translate3d(0px, 0, 0); }
      }

      @keyframes float-left-fg {
        0%   { transform: translate3d(0px, 0, 0); }
        100% { transform: translate3d(-396px, 0, 0); }
      }

      @keyframes subtle-pulse {
        0%, 100% { opacity: 0.35; }
        50%      { opacity: 0.70; }
      }

      .anim-wave-bg { animation: float-left-bg 24s linear infinite; }
      .anim-wave-mid { animation: float-right-mid 16s linear infinite; }
      .anim-wave-fg { animation: float-left-fg 11s linear infinite; }
      .anim-glow { animation: subtle-pulse 5s ease-in-out infinite; }
    </style>

    <filter id="pixel-shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feOffset in="SourceAlpha" dx="5" dy="5" result="offset" />
      <feFlood flood-color="#0D1117" result="shadow-color" />
      <feComposite in="shadow-color" in2="offset" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Bottom Fade Alpha Mask Definition -->
    <linearGradient id="fade-mask-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="82%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <mask id="bottom-fade-mask" maskUnits="userSpaceOnUse">
      <rect width="1584" height="320" fill="url(#fade-mask-grad)" />
    </mask>

    <!-- Background Base Gradient with Transparent Bottom -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="55%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </linearGradient>

    <!-- Central Radial Ambient Glow -->
    <radialGradient id="center-light" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#A0A0A0" stop-opacity="0.13" />
      <stop offset="60%" stop-color="#4A4A4A" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Transparent Wave Gradient Fill -->
    <linearGradient id="wave-fill-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#777777" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </linearGradient>

    <!-- Wave Stroke Gradients -->
    <linearGradient id="stroke-slate-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5C5C5C" stop-opacity="0.45" />
      <stop offset="34%" stop-color="#C8C8C8" stop-opacity="0.85" />
      <stop offset="68%" stop-color="#777777" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#454545" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="stroke-gray-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#303030" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#A0A0A0" stop-opacity="0.58" />
      <stop offset="100%" stop-color="#454545" stop-opacity="0.8" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Micro Tech Grid Pattern -->
    <pattern id="tech-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#C8C8C8" stroke-width="1" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <!-- MASKED GROUP: Background & Animated Waves Fade to Transparent at Bottom -->
  <g mask="url(#bottom-fade-mask)">
    <!-- Background Base -->
    <rect width="1584" height="320" fill="url(#bg-grad)" />
    <rect width="1584" height="320" fill="url(#tech-grid)" />
    <rect width="1584" height="320" fill="url(#center-light)" class="anim-glow" />

    <!-- Wave 1: Background Translucent Wave -->
    <g class="anim-wave-bg">
      <path d="M -792,160 
               Q -594,70 -396,160 T 0,160 T 396,160 T 792,160 T 1188,160 T 1584,160 T 1980,160 T 2376,160 
               L 2376,320 L -792,320 Z" 
            fill="url(#wave-fill-grad)" />
    </g>

  </g>

  <!-- UNMASKED CENTER CARD: Crisp & Clear Glassmorphism Content -->
  <g transform="translate(792, 150)">
        <rect x="-695" y="-110" width="1390" height="220" rx="22" 
          fill="#161B22" fill-opacity="0.55" 
          stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2" />
    
    <!-- Accent Corner Brackets -->
    <path d="M -670 -84 L -670 -96 L -658 -96" fill="none" stroke="#A6A6A6" stroke-width="3" stroke-linecap="square" opacity="0.9" />
    <path d="M 670 -84 L 670 -96 L 658 -96" fill="none" stroke="#A6A6A6" stroke-width="3" stroke-linecap="square" opacity="0.9" />
    <path d="M -670 84 L -670 96 L -658 96" fill="none" stroke="#A6A6A6" stroke-width="3" stroke-linecap="square" opacity="0.9" />
    <path d="M 670 84 L 670 96 L 658 96" fill="none" stroke="#A6A6A6" stroke-width="3" stroke-linecap="square" opacity="0.9" />

    <!-- Name Typography -->
    <g class="title-name"><path d="M250 125V250H125V375H0V750H125V875H250V1000H875V875H375V750H250V375H375V250H625V500H500V625H875V125Z" transform="translate(-577.000 -2.000) scale(0.064000 -0.064000)" fill="#4285F4" shape-rendering="crispEdges" /><path d="M0 125V750H125V875H250V1000H625V875H750V750H875V125H625V375H250V125ZM250 500H625V750H500V875H375V750H250Z" transform="translate(-510.000 -2.000) scale(0.064000 -0.064000)" fill="#EA4335" shape-rendering="crispEdges" /><path d="M125 125V250H0V1000H250V500H375V1000H500V500H625V1000H875V250H750V125H625V250H500V375H375V250H250V125Z" transform="translate(-443.000 -2.000) scale(0.064000 -0.064000)" fill="#FBBC05" shape-rendering="crispEdges" /><path d="M0 125V750H125V875H250V1000H625V875H750V750H875V125H625V375H250V125ZM250 500H625V750H500V875H375V750H250Z" transform="translate(-376.000 -2.000) scale(0.064000 -0.064000)" fill="#4285F4" shape-rendering="crispEdges" /><path d="M0 125V1000H250V625H625V1000H875V125H625V500H250V125Z" transform="translate(-309.000 -2.000) scale(0.064000 -0.064000)" fill="#34A853" shape-rendering="crispEdges" /><path d="M250 125V250H125V375H0V750H125V875H250V1000H750V875H875V750H625V875H375V750H250V375H375V250H625V375H875V250H750V125Z" transform="translate(-224.000 -2.000) scale(0.064000 -0.064000)" fill="#EA4335" shape-rendering="crispEdges" /><path d="M0 125V1000H250V625H625V1000H875V125H625V500H250V125Z" transform="translate(-157.000 -2.000) scale(0.064000 -0.064000)" fill="#4285F4" shape-rendering="crispEdges" /><path d="M125 125V250H0V875H125V1000H750V875H875V250H750V125ZM250 250H625V875H250Z" transform="translate(-90.000 -2.000) scale(0.064000 -0.064000)" fill="#EA4335" shape-rendering="crispEdges" /><path d="M0 125V1000H250V875H375V750H500V625H625V1000H875V125H625V375H500V500H375V625H250V125Z" transform="translate(-23.000 -2.000) scale(0.064000 -0.064000)" fill="#FBBC05" shape-rendering="crispEdges" /><path d="M250 125V250H125V375H0V750H125V875H250V1000H875V875H375V750H250V375H375V250H625V500H500V625H875V125Z" transform="translate(44.000 -2.000) scale(0.064000 -0.064000)" fill="#4285F4" shape-rendering="crispEdges" /><path d="M125 500V625H875V500Z" transform="translate(111.000 -2.000) scale(0.064000 -0.064000)" fill="#34A853" shape-rendering="crispEdges" /><path d="M125 125V250H0V375H250V250H625V500H125V625H0V875H125V1000H750V875H875V750H625V875H250V625H750V500H875V250H750V125Z" transform="translate(178.000 -2.000) scale(0.064000 -0.064000)" fill="#EA4335" shape-rendering="crispEdges" /><path d="M125 125V250H375V875H125V1000H875V875H625V250H875V125Z" transform="translate(245.000 -2.000) scale(0.064000 -0.064000)" fill="#4285F4" shape-rendering="crispEdges" /><path d="M0 125V1000H250V875H375V750H500V875H625V1000H875V125H625V625H500V375H375V625H250V125Z" transform="translate(312.000 -2.000) scale(0.064000 -0.064000)" fill="#EA4335" shape-rendering="crispEdges" /><path d="M0 125V750H125V875H250V1000H625V875H750V750H875V125H625V375H250V125ZM250 500H625V750H500V875H375V750H250Z" transform="translate(379.000 -2.000) scale(0.064000 -0.064000)" fill="#FBBC05" shape-rendering="crispEdges" /><path d="M0 125V1000H750V875H875V500H625V375H750V250H875V125H500V250H375V375H250V125ZM250 500H500V625H625V875H250Z" transform="translate(446.000 -2.000) scale(0.064000 -0.064000)" fill="#4285F4" shape-rendering="crispEdges" /><path d="M0 125V1000H625V875H750V750H875V375H750V250H625V125ZM250 250H500V375H625V750H500V875H250Z" transform="translate(513.000 -2.000) scale(0.064000 -0.064000)" fill="#34A853" shape-rendering="crispEdges" /></g>

    <!-- Subtitle Line -->
    <text y="58" class="subtitle-text">ASIC Engineer <tspan fill="#808080">|</tspan> Developer <tspan fill="#808080">|</tspan> CEng @ UVic</text>
  </g>
</svg>
