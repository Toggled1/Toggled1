<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 320" width="100%" height="100%">
  <defs>
    <!-- Modern Engineering Typography -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=Orbitron:wght@600;700&amp;display=swap');

      .title-name {
        font-family: 'Orbitron', 'Space Grotesk', sans-serif;
        font-weight: 600;
        font-size: 64px;
        fill: #F5F5F5;
        letter-spacing: 8px;
        text-anchor: middle;
        text-transform: uppercase;
        animation: title-arrive 1.1s cubic-bezier(.2,.75,.25,1) both;
      }

      .subtitle-text {
        font-family: 'IBM Plex Mono', 'Fira Code', monospace;
        font-weight: 500;
        font-size: 25px;
        fill: #D6D6D6;
        letter-spacing: 4px;
        text-anchor: middle;
        animation: subtitle-arrive .8s ease-out .35s both;
      }

      @keyframes title-arrive {
        from { opacity: 0; letter-spacing: 18px; }
        to { opacity: 1; letter-spacing: 8px; }
      }

      @keyframes subtitle-arrive {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .wave-path {
        fill: none;
        stroke-linecap: round;
        will-change: transform;
      }

      /* Seamless Wave Animation Loops */
      @keyframes float-left-bg {
        0%   { transform: translate3d(0px, 0, 0); }
        100% { transform: translate3d(-792px, 0, 0); }
      }

      @keyframes float-right-mid {
        0%   { transform: translate3d(-528px, 0, 0); }
        100% { transform: translate3d(0px, 0, 0); }
      }

      @keyframes float-left-fg {
        0%   { transform: translate3d(0px, 0, 0); }
        100% { transform: translate3d(-396px, 0, 0); }
      }

      @keyframes subtle-pulse {
        0%, 100% { opacity: 0.35; }
        50%      { opacity: 0.70; }
      }

      .anim-wave-bg { animation: float-left-bg 24s linear infinite; }
      .anim-wave-mid { animation: float-right-mid 16s linear infinite; }
      .anim-wave-fg { animation: float-left-fg 11s linear infinite; }
      .anim-glow { animation: subtle-pulse 5s ease-in-out infinite; }
    </style>

    <!-- Bottom Fade Alpha Mask Definition -->
    <linearGradient id="fade-mask-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="82%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <mask id="bottom-fade-mask" maskUnits="userSpaceOnUse">
      <rect width="1584" height="320" fill="url(#fade-mask-grad)" />
    </mask>

    <!-- Background Base Gradient with Transparent Bottom -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="55%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </linearGradient>

    <!-- Central Radial Ambient Glow -->
    <radialGradient id="center-light" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#A0A0A0" stop-opacity="0.13" />
      <stop offset="60%" stop-color="#4A4A4A" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Transparent Wave Gradient Fill -->
    <linearGradient id="wave-fill-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#777777" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </linearGradient>

    <!-- Wave Stroke Gradients -->
    <linearGradient id="stroke-slate-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5C5C5C" stop-opacity="0.45" />
      <stop offset="34%" stop-color="#C8C8C8" stop-opacity="0.85" />
      <stop offset="68%" stop-color="#777777" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#454545" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="stroke-gray-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#303030" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#A0A0A0" stop-opacity="0.58" />
      <stop offset="100%" stop-color="#454545" stop-opacity="0.8" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Micro Tech Grid Pattern -->
    <pattern id="tech-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#C8C8C8" stroke-width="1" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <!-- MASKED GROUP: Background & Animated Waves Fade to Transparent at Bottom -->
  <g mask="url(#bottom-fade-mask)">
    <!-- Background Base -->
    <rect width="1584" height="320" fill="url(#bg-grad)" />
    <rect width="1584" height="320" fill="url(#tech-grid)" />
    <rect width="1584" height="320" fill="url(#center-light)" class="anim-glow" />

    <!-- Wave 1: Background Translucent Wave -->
    <g class="anim-wave-bg">
      <path d="M -792,160 
               Q -594,70 -396,160 T 0,160 T 396,160 T 792,160 T 1188,160 T 1584,160 T 1980,160 T 2376,160 
               L 2376,320 L -792,320 Z" 
            fill="url(#wave-fill-grad)" />
    </g>

  </g>

  <!-- UNMASKED CENTER CARD: Crisp & Clear Glassmorphism Content -->
  <g transform="translate(792, 150)">
        <rect x="-695" y="-110" width="1390" height="220" rx="22" 
          fill="#161B22" fill-opacity="0.55" 
          stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2" />
    
    <!-- Accent Corner Brackets -->
    <path d="M -670 -84 L -670 -96 L -658 -96" fill="none" stroke="#A6A6A6" stroke-width="3" stroke-linecap="square" opacity="0.9" />
    <path d="M 670 -84 L 670 -96 L 658 -96" fill="none" stroke="#A6A6A6" stroke-width="3" stroke-linecap="square" opacity="0.9" />
    <path d="M -670 84 L -670 96 L -658 96" fill="none" stroke="#A6A6A6" stroke-width="3" stroke-linecap="square" opacity="0.9" />
    <path d="M 670 84 L 670 96 L 658 96" fill="none" stroke="#A6A6A6" stroke-width="3" stroke-linecap="square" opacity="0.9" />

    <!-- Name Typography -->
    <text y="-2" class="title-name"><tspan fill="#4285F4">G</tspan><tspan fill="#EA4335">A</tspan><tspan fill="#FBBC05">W</tspan><tspan fill="#4285F4">A</tspan><tspan fill="#34A853">H</tspan><tspan fill="#EA4335" dx="18">C</tspan><tspan fill="#4285F4">H</tspan><tspan fill="#EA4335">O</tspan><tspan fill="#FBBC05">N</tspan><tspan fill="#4285F4">G</tspan><tspan fill="#34A853">-</tspan><tspan fill="#EA4335">S</tspan><tspan fill="#4285F4">I</tspan><tspan fill="#EA4335">M</tspan><tspan fill="#FBBC05">A</tspan><tspan fill="#4285F4">R</tspan><tspan fill="#34A853">D</tspan></text>

    <!-- Subtitle Line -->
    <text y="58" class="subtitle-text">ASIC Engineer <tspan fill="#808080">|</tspan> Developer <tspan fill="#808080">|</tspan> CEng @ UVic</text>
  </g>
</svg>
